<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1763b5">
  <title>Arya</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background-color: #3e9ce4;
      background-image:
        linear-gradient(180deg, rgba(5, 37, 91, 0.12), rgba(5, 37, 91, 0.02) 62%, rgba(7, 52, 105, 0.16)),
        url("fondo.jpg"),
        linear-gradient(180deg, #174991 0%, #2489d2 59%, #c5e9fa 100%);
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
    }

    h1 {
      margin: 0;
      color: #fff;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(4rem, 13vw, 10rem);
      font-weight: 400;
      line-height: 1;
      text-shadow: 0 3px 24px rgba(4, 36, 83, 0.28);
      animation: arrive 900ms ease-out both;
    }

    @keyframes arrive {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      h1 {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Arya</h1>
  </main>
</body>
</html>
